<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حاسبة الربح</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e3e7ec;--ok:#12805c;--bad:#c0392b;--acc:#1f5eff}
  @media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1b212a;--ink:#eef1f5;--mute:#9aa5b4;--line:#2a323d;--ok:#3ecf9b;--bad:#ff7b6b;--acc:#6b95ff}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  h1{font-size:1.3rem;margin:8px 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .card h2{font-size:1rem;margin:0 0 12px}
  label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .row.one{grid-template-columns:1fr}
  input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1rem}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:.95rem;cursor:pointer}
  .tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .big{text-align:center;padding:8px 0}
  .big .v{font-size:2rem;font-weight:700}
  .big .l{color:var(--mute);font-size:.85rem}
  .pos{color:var(--ok)}.neg{color:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  td{padding:7px 0;border-bottom:1px solid var(--line)}
  td:last-child{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
  tr:last-child td{border-bottom:0}
  .note{font-size:.8rem;color:var(--mute);margin-top:8px}
  .hide{display:none}
</style>
</head>
